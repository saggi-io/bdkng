name: Kalenderdateien erzeugen
on:
  push:
    paths: ['data/termine-kalender.json', 'data/muell.json', 'data/sport-termine.json', 'tools/kalender_ics.py']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kalender
  cancel-in-progress: false
jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "bdkng-bot"
          git config user.email "bot@bdkng.de"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/kalender_ics.py
            git add kalender
            if git diff --cached --quiet; then echo "nichts zu tun"; exit 0; fi
            git commit -q -m "Kalenderdateien aktualisiert"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i*5))
          done
          exit 1
