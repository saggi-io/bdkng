name: Social-Karten rendern
on:
  push:
    paths: ['data/karten/**.json', 'tools/karte.py', 'tools/karte2.py', 'tools/karte3.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: karten
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji
      - run: python3 tools/karte.py
      - run: |
          git config user.name "bdkng-bot"
          git config user.email "bot@bdkng.de"
          git add -A assets/social/karten data/karten
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Social-Karten gerendert"
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "gepusht"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push abgelehnt, neuer Versuch $i"; sleep $((i*4))
          done
          exit 1
