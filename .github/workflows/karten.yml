name: Social-Karten rendern
on:
  push:
    paths: ['data/karten/**.json', 'tools/karte.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: karten
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/karte.py
      - run: |
          git config user.name "bdkng-bot"
          git config user.email "bot@bdkng.de"
          git add assets/social/karten
          git diff --cached --quiet || (git commit -m "Social-Karten gerendert" && git pull --rebase && git push)
