<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bad König Shop – kommt bald</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f7f7f7;margin:0}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:3rem}
.card{background:#fff;max-width:720px;padding:3rem;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{margin:.2em 0;font-size:2.2rem}
p{color:#555;line-height:1.6}
.badge{display:inline-block;margin-bottom:1rem;padding:.4rem .7rem;border-radius:999px;background:#eee;font-size:.85rem}
.footer{margin-top:2rem;color:#888;font-size:.85rem}
</style>
</head>
<body>
<div class="hero">
  <div class="card">
    <span class="badge">Bad König · Odenwald</span>
    <h1>Der Bad-König-Shop</h1>
    <p>Regionale Produkte, besondere Ideen und echte Verbundenheit zur Stadt.<br>
    Der Shop startet in Kürze.</p>
    <div class="footer">© Bad König · Launch folgt</div>
  </div>
</div>
</body>
</html>
